<div class="avisos-toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;">
  @for (aviso of avisosService.avisos(); track aviso.id) {
    <div
      class="toast show align-items-center mb-2 border-0 shadow-lg text-white aviso-toast-card"
      [ngClass]="{
        'bg-success': aviso.tipo === 'exito',
        'bg-danger': aviso.tipo === 'error',
        'bg-primary': aviso.tipo === 'info',
        'bg-warning text-dark': aviso.tipo === 'advertencia'
      }"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2 py-2 px-3">
          <!-- Iconos según el tipo -->
          @if (aviso.tipo === 'exito') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          } @else if (aviso.tipo === 'error') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
          } @else if (aviso.tipo === 'advertencia') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          } @else {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          }
          <span class="aviso-texto fw-semibold">{{ aviso.mensaje }}</span>
        </div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          [class.btn-close-dark]="aviso.tipo === 'advertencia'"
          (click)="cerrar(aviso.id)"
          aria-label="Cerrar aviso"
        ></button>
      </div>
    </div>
  }
</div>
